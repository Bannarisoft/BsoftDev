name: CI/CD Deploy to Development (Kubernetes + Docker on Linux)

on:
  push:
    branches:
      - Development
      - feature/*

jobs:
  build-test-deploy:
    name: Build, Test and Deploy Microservices
    environment: Development
    runs-on: [self-hosted, Linux, X64]

    env:
      # ----- Secrets (coalesced) -----
      EMAIL_TO:          ${{ secrets.EMAIL_TO          || '' }}
      EMAIL_FROM:        ${{ secrets.EMAIL_FROM        || '' }}
      SMTP_HOST:         ${{ secrets.SMTP_HOST         || '' }}
      SMTP_PORT:         ${{ secrets.SMTP_PORT         || '' }}
      SMTP_USER:         ${{ secrets.SMTP_USER         || '' }}
      SMTP_PASS:         ${{ secrets.SMTP_PASS         || '' }}
      SLACK_WEBHOOK:     ${{ secrets.SLACK_WEBHOOK     || '' }}

      DOCKER_USERNAME:   ${{ secrets.DOCKER_USERNAME   || '' }}
      DOCKER_PASSWORD:   ${{ secrets.DOCKER_PASSWORD   || '' }}

      PFX_CERT_BASE64:   ${{ secrets.PFX_CERT_BASE64   || '' }}
      PFX_CERT_PASSWORD: ${{ secrets.PFX_CERT_PASSWORD || '' }}

      KUBECONFIG:        ${{ github.workspace }}/kubeconfig
      KUBE_NS:           default

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: 🛡️ Setup Kubeconfig (Base64 Decode)
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "${{ env.KUBECONFIG }}"
          export KUBECONFIG="${{ env.KUBECONFIG }}"

      - name: 🔐 Docker Hub Login
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        shell: bash
        run: |
          echo "${{ env.DOCKER_PASSWORD }}" | docker login -u "${{ env.DOCKER_USERNAME }}" --password-stdin

      # ===== SSL CERT FOR gRPC (ASP.NET Core with PFX) =====
      - name: 🔐 Decode certificate.pfx from secret
        if: env.PFX_CERT_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Certs
          if ! printf '%s' "${PFX_CERT_BASE64}" | tr -d '\r' | base64 -d > Certs/certificate.pfx; then
            echo "❌ Base64 decode failed. Recreate the secret as a single-line Base64 string."; exit 1
          fi
          echo "✅ certificate.pfx created at Certs/certificate.pfx"

      - name: 🔐 Create/Update HTTPS secret in Kubernetes (PFX + password)
        if: env.PFX_CERT_BASE64 != '' && env.PFX_CERT_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="${KUBECONFIG}"
          NS="${KUBE_NS}"

          test -f Certs/certificate.pfx || { echo "❌ Certs/certificate.pfx missing"; exit 1; }

          SEC_NAME="aspnet-https"
          kubectl -n "$NS" delete secret "$SEC_NAME" --ignore-not-found
          kubectl -n "$NS" create secret generic "$SEC_NAME" \
            --from-file=tls.pfx=Certs/certificate.pfx \
            --from-literal=Kestrel__Certificates__Default__Password="${PFX_CERT_PASSWORD}"
          echo "✅ Created secret $SEC_NAME in namespace $NS"

      - name: 🔨 Build .NET Solutions
        shell: bash
        run: |
          set -e
          for sln in \
            UserManagement/UserManagement.sln \
            MaintenanceManagement/MaintenanceManagement.sln \
            FixedAssetManagement/FixedAssetManagement.sln \
            BackgroundService/BackgroundService.sln \
            SagaOrchestrator/SagaOrchestrator.sln; do
            echo "Building $sln"
            dotnet build "$sln" -c Release
          done

      - name: 🧪 Run Unit Tests
        shell: bash
        run: |
          set -e
          find . -type f -name "*.Tests.csproj" | while read test; do
            echo "🧪 Testing: $test"
            dotnet test "$test" -c Release --no-build --verbosity normal
          done

      - name: 🧪 Docker Version Check
        shell: bash
        run: |
          docker version || exit 1
          docker buildx version || echo "🟡 buildx not installed, skipping..."

      - name: 🐳 Build Docker Images
        shell: bash
        run: |
          docker build -t docker.io/${{ env.DOCKER_USERNAME }}/usermanagement:dev -f ./UserManagement/Dockerfile .
          docker build -t docker.io/${{ env.DOCKER_USERNAME }}/maintenance:dev    -f ./MaintenanceManagement/Dockerfile .
          docker build -t docker.io/${{ env.DOCKER_USERNAME }}/fixedasset:dev     -f ./FixedAssetManagement/Dockerfile .
          docker build -t docker.io/${{ env.DOCKER_USERNAME }}/background:dev     -f ./BackgroundService/Dockerfile .
          docker build -t docker.io/${{ env.DOCKER_USERNAME }}/saga:dev           -f ./SagaOrchestrator/Dockerfile .

      - name: 📤 Push Docker Images to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        shell: bash
        run: |
          docker push docker.io/${{ env.DOCKER_USERNAME }}/usermanagement:dev
          docker push docker.io/${{ env.DOCKER_USERNAME }}/maintenance:dev
          docker push docker.io/${{ env.DOCKER_USERNAME }}/fixedasset:dev
          docker push docker.io/${{ env.DOCKER_USERNAME }}/background:dev
          docker push docker.io/${{ env.DOCKER_USERNAME }}/saga:dev

      - name: 🐰 Deploy RabbitMQ (with endpoint + TCP prechecks)
        shell: bash
        run: |
          set -e
          export KUBECONFIG="${{ env.KUBECONFIG }}"
          NS="${{ env.KUBE_NS }}"

          kubectl apply -n "$NS" -f k8s/rabbitmq/ --validate=false
          kubectl rollout status -n "$NS" deployment/rabbitmq --timeout=300s
          kubectl wait -n "$NS" --for=condition=ready pod -l app=rabbitmq --timeout=180s

          echo "👉 Endpoints:"
          kubectl get endpoints -n "$NS" rabbitmq -o wide

          echo "👉 Smoke TCP to FQDN:"
          kubectl delete pod/rmq-netcheck -n "$NS" --ignore-not-found
          set +e
          kubectl run rmq-netcheck -n "$NS" \
            --image=busybox:1.36 \
            --restart=Never \
            --attach \
            --rm \
            -- sh -c "nc -zvw 2 rabbitmq.${NS}.svc.cluster.local 5672 && echo OK"
          STATUS=$?
          set -e
          test $STATUS -eq 0 || { echo '❌ Cannot reach rabbitmq.'"${NS}"'.svc.cluster.local:5672'; exit 1; }

      - name: 🚢 Deploy Microservices (with Rollback + better diagnostics)
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="${{ env.KUBECONFIG }}"
          NS="${{ env.KUBE_NS }}"

          mkdir -p artifacts
          : > artifacts/rollback-log.txt

          debug_dump() {
            local svc="$1"
            {
              echo "===== DEBUG for $svc (namespace=$NS) ====="
              echo "Pods:"
              kubectl get pods -n "$NS" -l app="$svc" -o wide || true
              echo "----- DESCRIBE deployment/$svc-deployment -----"
              kubectl describe deployment -n "$NS" "$svc-deployment" || true
              echo "----- DESCRIBE pods (events) -----"
              kubectl describe pods -n "$NS" -l app="$svc" || true
              echo "----- INIT LOGS (wait-for-rabbitmq) -----"
              for p in $(kubectl get pods -n "$NS" -l app="$svc" -o jsonpath='{.items[*].metadata.name}'); do
                echo "--- pod: $p"
                kubectl logs -n "$NS" "$p" -c wait-for-rabbitmq --tail=200 || true
              done
              echo "----- MAIN CONTAINER LOGS (last 100) -----"
              kubectl logs -n "$NS" -l app="$svc" --tail=100 --all-containers=false || true
              echo
            } >> artifacts/rollback-log.txt 2>&1
          }

          for svc in usermanagement maintenance fixedasset background saga; do
            echo "🚀 Deploying $svc"

            if ! kubectl apply --dry-run=server -n "$NS" -f "k8s/$svc" > /dev/null; then
              echo "❌ $svc dry-run validation failed" | tee -a artifacts/rollback-log.txt
              continue
            fi

            kubectl delete -n "$NS" svc "$svc-service" --ignore-not-found

            if kubectl get deployment -n "$NS" "$svc-deployment" > /dev/null 2>&1; then
              ts=$(date +%s)
              kubectl patch -n "$NS" deployment "$svc-deployment" \
                -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"ci-timestamp\":\"$ts\"}}}}}"
              kubectl annotate -n "$NS" deployment "$svc-deployment" \
                "kubernetes.io/change-cause=CI/CD deploy at $(date)" --overwrite
            else
              echo "⚠️ Deployment $svc-deployment not found, skipping patch/annotate" | tee -a artifacts/rollback-log.txt
            fi

            if ! kubectl apply -n "$NS" -f "k8s/$svc"; then
              echo "❌ Failed to apply $svc deployment" | tee -a artifacts/rollback-log.txt
              debug_dump "$svc"
              continue
            fi

            echo "⏳ Waiting for rollout of $svc-deployment..."
            sleep 5

            if ! kubectl rollout status -n "$NS" deployment/"$svc-deployment" --timeout=600s; then
              echo "❌ Rollout timeout for $svc" | tee -a artifacts/rollback-log.txt
              debug_dump "$svc"
              echo "🔁 Rolling back $svc-deployment..."
              kubectl rollout undo -n "$NS" deployment/"$svc-deployment" || true
              echo "🔁 Rollback triggered for $svc" | tee -a artifacts/rollback-log.txt
              continue
            fi

            echo "✅ $svc deployment succeeded"
            kubectl rollout history -n "$NS" deployment/"$svc-deployment" > "artifacts/$svc-revision-history.txt"
          done

      - name: 📤 Upload Rollback Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-logs
          path: artifacts/rollback-log.txt

      - name: 🔗 Output Service URLs with Health Check & Save Summary
        id: healthcheck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          INGRESS_IP=$(kubectl get ingress -A -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          INGRESS_HOST=$(kubectl get ingress -A -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || true)
          NODE_IP=$(kubectl get nodes -o jsonpath='{range .items[*]}{.status.addresses[?(@.type=="ExternalIP")].address}{"\n"}{end}' | head -n1 || true)
          if [[ -z "$NODE_IP" ]]; then
            NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          fi
          if [[ -n "${INGRESS_HOST:-}" ]]; then TARGET_HOST="$INGRESS_HOST";
          elif [[ -n "${INGRESS_IP:-}" ]]; then TARGET_HOST="$INGRESS_IP";
          else TARGET_HOST="$NODE_IP"; fi
          echo "🌐 Health checks will target: ${TARGET_HOST}"

          declare -A ports=(
            [usermanagement]=30574
            [maintenance]=30593
            [fixedasset]=30594
            [background]=30511
            [saga]=30592
          )

          echo "Service Health Summary - $(date)" > artifacts/health-summary.txt
          echo "----------------------------------" >> artifacts/health-summary.txt

          for svc in "${!ports[@]}"; do
            url="http://${TARGET_HOST}:${ports[$svc]}/health"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$url" || echo 000)
            case "$code" in
              200|204|301|302|307|308) echo "✅ $svc (${ports[$svc]}): $code OK" | tee -a artifacts/health-summary.txt ;;
              *)                       echo "❌ $svc (${ports[$svc]}): $code"   | tee -a artifacts/health-summary.txt ;;
            esac
          done

          echo -e "\nIn-cluster Health (ClusterIP):" | tee -a artifacts/health-summary.txt
          kubectl delete pod/healthcheck-curl --ignore-not-found >/dev/null 2>&1 || true
          kubectl run healthcheck-curl --image=curlimages/curl --restart=Never --command -- sleep 300
          kubectl wait --for=condition=Ready pod/healthcheck-curl --timeout=60s

          for svc in usermanagement maintenance fixedasset background saga; do
            port=$(kubectl get svc "${svc}-service" -o jsonpath='{.spec.ports[?(@.name=="http")].port}')
            code=$(kubectl exec healthcheck-curl -- sh -c \
              "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://${svc}-service.default.svc.cluster.local:${port}/health" \
              || echo 000)
            case "$code" in
              200|204|301|302|307|308) echo "  ✅ $svc (cluster): $code OK" | tee -a artifacts/health-summary.txt ;;
              *)                       echo "  ❌ $svc (cluster): $code"   | tee -a artifacts/health-summary.txt ;;
            esac
          done

          kubectl delete pod/healthcheck-curl --now --ignore-not-found >/dev/null 2>&1 || true

      - name: 📤 Upload Health Summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-summary
          path: artifacts/health-summary.txt

      - name: 📧 Send Email via Zimbra SMTP
        if: always() && env.EMAIL_TO != '' && env.EMAIL_FROM != '' && env.SMTP_HOST != '' && env.SMTP_PORT != '' && env.SMTP_USER != '' && env.SMTP_PASS != ''
        shell: bash
        run: |
          TO="${{ env.EMAIL_TO }}"
          FROM="${{ env.EMAIL_FROM }}"
          HOST="${{ env.SMTP_HOST }}"
          PORT="${{ env.SMTP_PORT }}"
          USER="${{ env.SMTP_USER }}"
          PASS="${{ env.SMTP_PASS }}"

          cat <<EOF > ~/.msmtprc
          defaults
          auth on
          tls on
          tls_certcheck off
          logfile ~/.msmtp.log

          account default
          host ${HOST}
          port ${PORT}
          from ${FROM}
          user ${USER}
          password ${PASS}
          EOF

          chmod 600 ~/.msmtprc

          HEALTH_FILE="${{ github.workspace }}/artifacts/health-summary.txt"
          ROLLBACK_FILE="${{ github.workspace }}/artifacts/rollback-log.txt"

          HEALTH_RESULTS="$( [ -f "$HEALTH_FILE" ] && cat "$HEALTH_FILE" || echo 'Health summary not available.' )"
          ROLLBACK_DETAILS="$( [ -s "$ROLLBACK_FILE" ] && cat "$ROLLBACK_FILE" || echo '✅ No rollback triggered.' )"

          printf '%s\n' "Subject: 🔔 CI/CD Deployment - ${{ job.status }}
          To: ${TO}
          Project: BSOFT
          Environment: Development
          Status: ${{ job.status }}

          Rollback Details:
          ${ROLLBACK_DETAILS}

          Health Check Summary:
          ${HEALTH_RESULTS}

          Time: $(date)
          " | msmtp ${TO}

      - name: 📢 Send Slack (jq)
        if: always() && env.SLACK_WEBHOOK != ''
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:=/tmp}"
          if ! command -v jq >/dev/null 2>&1; then
            JQ_BIN="$RUNNER_TEMP/bin/jq"
            mkdir -p "$(dirname "$JQ_BIN")"
            curl -fsSL -o "$JQ_BIN" https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            chmod +x "$JQ_BIN"
            export PATH="$(dirname "$JQ_BIN"):$PATH"
          fi
          jq --version

          STATUS="${{ job.status }}"
          COLOR="#36a64f"; [ "$STATUS" = "failure" ] && COLOR="#ff0000" || true
          [ "$STATUS" = "cancelled" ] && COLOR="#cccc00" || true

          HEALTH_FILE="${{ github.workspace }}/artifacts/health-summary.txt"
          ROLLBACK_FILE="${{ github.workspace }}/artifacts/rollback-log.txt"
          HEALTH_MSG="$( [ -s "$HEALTH_FILE" ] && cat "$HEALTH_FILE" || echo "⚠️ Health summary not available." )"
          ROLLBACK_MSG="$( [ -s "$ROLLBACK_FILE" ] && cat "$ROLLBACK_FILE" || echo "✅ No rollback triggered." )"
          HEALTH_MSG="${HEALTH_MSG:0:2900}"
          ROLLBACK_MSG="${ROLLBACK_MSG:0:2900}"

          jq -n \
            --arg color "$COLOR" \
            --arg status "$STATUS" \
            --arg branch "${GITHUB_REF#refs/heads/}" \
            --arg env "Development" \
            --arg rollback "$ROLLBACK_MSG" \
            --arg health "$HEALTH_MSG" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson ts "$(date +%s)" '
            {attachments:[{
              color:$color,
              title:"🚀 BSOFT CI/CD - \($status)",
              fields:[
                {title:"Branch", value:$branch, short:true},
                {title:"Environment", value:$env, short:true},
                {title:"Rollback Info", value:$rollback},
                {title:"Health Check",  value:$health}
              ],
              footer:"GitHub Actions",
              ts:$ts,
              actions:[{type:"button", text:"🔍 View Workflow Run", url:$url}]
            }]} ' > payload.json

          curl -sS -X POST -H 'Content-type: application/json' --data-binary @payload.json "$SLACK_WEBHOOK"

      - name: 🧼 Docker Cleanup
        if: always()
        shell: bash
        run: |
          docker system prune -af
          docker builder prune -af

syntax = "proto3";

import "google/protobuf/empty.proto";

option csharp_namespace = "GrpcServices.BackgroundService";

service ApprovalRequestByApproverService {
    rpc GetApprovalRequestByApprover (ApprovalRequestByApprover) returns (ApprovalByApproverResponse);
}
message ApprovalRequestByApprover {
    string ModuleTypeName = 1;
    int32 ApproverId = 2;
}
message ApprovalByApproverDto {
    int32 ModuleTransactionId = 1;
    int32 ApprovalRequestId = 2;
    string CurrentStatus = 3;
    string ModuleTypeName = 4;
}

message ApprovalByApproverResponse {
    repeated ApprovalByApproverDto approvalstatus = 1;
}
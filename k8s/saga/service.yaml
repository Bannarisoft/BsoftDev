apiVersion: v1
kind: Service
metadata:
  name: saga-service
  labels:
    app: saga
    app.kubernetes.io/name: saga
    app.kubernetes.io/component: orchestrator
spec:
  selector:
    app: saga
  type: NodePort  # ✅ Makes the service accessible via <minikube_ip>:nodePort
  ports:
    - name: http
      protocol: TCP
      port: 5192           # Internal cluster port
      targetPort: 5192     # Maps to containerPort in Deployment
      nodePort: 30592      # Externally accessible on this port
    - name: grpc
      protocol: TCP
      port: 7278
      targetPort: 7278
      nodePort: 30778

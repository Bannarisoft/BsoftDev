apiVersion: v1
kind: Secret
metadata:
  name: saga-secrets
  namespace: default
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Server=192.168.1.126;Database=SagaDb;User Id=sa;Password=YourPassword@123;Encrypt=True;TrustServerCertificate=True"
  Jwt__Key: "change-me-to-a-long-random-32+byte-secret"
  Jwt__Issuer: "bsoft.saga"
  Jwt__Audience: "bsoft.all"
  RabbitMq__Host: "rabbitmq"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
  # RabbitMq__VirtualHost: "/"    # uncomment if you use a custom vhost
  # RabbitMq__Port: "5672"        # only if non-default

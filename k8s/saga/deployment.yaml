apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-deployment
  labels:
    app: saga
    app.kubernetes.io/name: saga
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saga
  template:
    metadata:
      labels:
        app: saga
        app.kubernetes.io/name: saga
        app.kubernetes.io/component: orchestrator
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh","-c","until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done"]
      containers:
        - name: saga
          image: docker.io/bannarisoft/saga:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5192
            - name: grpc
              containerPort: 7278
          # Keep environment minimal to avoid duplicate Kestrel binds
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
          envFrom:
            - secretRef:
                name: saga-secrets
          # Probes (match your Service http port)
          startupProbe:
            httpGet: { path: /health/live,  port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live,  port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }

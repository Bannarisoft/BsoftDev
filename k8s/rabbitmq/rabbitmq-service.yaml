apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
spec:
  selector:
    app: rabbitmq
  publishNotReadyAddresses: true # allows DNS resolution before pod is ready (good for init containers)
  type: NodePort # NodePort gives you external access on minikube IP
  ports:
    - name: amqp
      protocol: TCP
      port: 5672 # cluster-internal port
      targetPort: 5672 # containerPort from RabbitMQ deployment
      nodePort: 30072 # external port => minikube-ip:30072
    - name: management
      protocol: TCP
      port: 15672 # cluster-internal port (mgmt UI)
      targetPort: 15672
      nodePort: 31672 # external port => minikube-ip:31672

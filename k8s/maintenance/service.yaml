apiVersion: v1
kind: Service
metadata:
  name: maintenance-service
  labels:
    app: maintenance
    app.kubernetes.io/name: maintenance
    app.kubernetes.io/component: web-api
spec:
  selector:
    app: maintenance
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 5293 # Cluster-internal port
      targetPort: 5293 # Container port (must match deployment)
      nodePort: 30593 # Access externally via <minikube-ip>:30593
    - name: grpc
      protocol: TCP
      port: 7243
      targetPort: 7243
      nodePort: 30743 # Access externally via <minikube-ip>:30743

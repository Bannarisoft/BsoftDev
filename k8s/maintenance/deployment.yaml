apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-deployment
  labels:
    app: maintenance
    app.kubernetes.io/name: maintenance
    app.kubernetes.io/component: web-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maintenance            # ← selector must stay stable
  template:
    metadata:
      labels:
        app: maintenance          # must include selector label
        app.kubernetes.io/name: maintenance
        app.kubernetes.io/component: web-api
    spec:
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do
                echo "waiting for rabbitmq"
                sleep 2
              done

      containers:
        - name: maintenance
          image: docker.io/bannarisoft/maintenance:dev
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5293
            - name: grpc
              containerPort: 7243

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: Kestrel__Endpoints__Http__Url
              value: "http://0.0.0.0:5293"
            - name: Kestrel__Endpoints__Http__Protocols
              value: "Http1"
            - name: Kestrel__Endpoints__Grpc__Url
              value: "http://0.0.0.0:7243"
            - name: Kestrel__Endpoints__Grpc__Protocols
              value: "Http2"

            # RabbitMQ
            - name: MassTransit__RabbitMq__Host
              value: "rabbitmq"
            - name: MassTransit__RabbitMq__Username
              value: "guest"
            - name: MassTransit__RabbitMq__Password
              value: "guest"

          envFrom:
            - secretRef:
                name: maintenance-secrets
            - secretRef:
                name: jwt-secret

          # Probes (your app exposes /health)
          startupProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }

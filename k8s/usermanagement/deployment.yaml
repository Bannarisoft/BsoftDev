apiVersion: apps/v1
kind: Deployment
metadata:
  name: usermanagement-deployment
  labels:
    app: usermanagement
    app.kubernetes.io/name: usermanagement
    app.kubernetes.io/component: web-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usermanagement
  template:
    metadata:
      labels:
        app: usermanagement
        app.kubernetes.io/name: usermanagement
        app.kubernetes.io/component: web-api
    spec:
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh","-c","until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done"]

      containers:
        - name: usermanagement
          image: docker.io/bannarisoft/usermanagement:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5174
            - name: grpc
              containerPort: 7031
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: Kestrel__Endpoints__Http__Url
              value: "http://0.0.0.0:5174"
            - name: Kestrel__Endpoints__Http__Protocols
              value: "Http1"
            - name: Kestrel__Endpoints__Grpc__Url
              value: "http://0.0.0.0:7031"
            - name: Kestrel__Endpoints__Grpc__Protocols
              value: "Http2"
            - name: MassTransit__RabbitMq__Host
              value: "rabbitmq"
            - name: MassTransit__RabbitMq__Username
              value: "guest"
            - name: MassTransit__RabbitMq__Password
              value: "guest"

          envFrom:
            - secretRef: { name: usermanagement-secrets }
            - secretRef: { name: jwt-secret }

          # Use public endpoints: /healthz (live/startup) and /readyz (ready)
          startupProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }

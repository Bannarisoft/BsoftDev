apiVersion: v1
kind: Secret
metadata:
  name: background-secrets
  # namespace: default   # <- uncomment & set if your Deployment is in a non-default namespace
type: Opaque
stringData:
  # Database
  DATABASE_SERVER: "192.168.1.126"
  DATABASE_USERID: "developer"
  DATABASE_PASSWORD: "Dev@#$456"

  # Hangfire schema (avoids 'Job' table collision)
  Hangfire__SchemaName: "HangFire_BG"

  # RabbitMQ / MassTransit
  MassTransit__RabbitMq__Host: "rabbitmq"
  MassTransit__RabbitMq__Username: "guest"
  MassTransit__RabbitMq__Password: "guest"

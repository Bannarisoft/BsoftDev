apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-deployment
  labels:
    app: background
    app.kubernetes.io/name: background
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: background
  template:
    metadata:
      labels:
        app: background
        app.kubernetes.io/name: background
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      containers:
        - name: background
          image: docker.io/bannarisoft/background:dev
          imagePullPolicy: Always

          # Only expose HTTP since the app listens on 5011 in container
          ports:
            - name: http
              containerPort: 5011

          # IMPORTANT: run in non-Development to avoid dev cert expectations
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Container"          # or "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:5011"

          # Pull DB / Hangfire / RabbitMQ envs from your secret
          envFrom:
            - secretRef:
                name: background-secrets

          # Give the app time to warm up before readiness/liveness kick in
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30     # up to ~150s for cold start

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

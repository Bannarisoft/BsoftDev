apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-deployment
  labels:
    app: background
    app.kubernetes.io/name: background
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: background
  template:
    metadata:
      labels:
        app: background
        app.kubernetes.io/name: background
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      containers:
        - name: background
          image: docker.io/bannarisoft/background:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5011
            - name: grpc
              containerPort: 7111
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:5011"
          envFrom:
            - secretRef:
                name: background-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

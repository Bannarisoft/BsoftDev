apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixedasset-deployment
  labels:
    app: fixedasset
    app.kubernetes.io/name: fixedasset
    app.kubernetes.io/component: web-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixedasset # ← selector must remain stable
  template:
    metadata:
      labels:
        app: fixedasset # must include selector label
        app.kubernetes.io/name: fixedasset
        app.kubernetes.io/component: web-api
    spec:
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do
                echo "waiting for rabbitmq"
                sleep 2
              done

      containers:
        - name: fixedasset
          image: docker.io/bannarisoft/fixedasset:dev
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5194
            - name: grpc
              containerPort: 7039

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            # Kestrel bindings (HTTP 1.1 + gRPC h2c)
            - name: Kestrel__Endpoints__Http__Url
              value: "http://0.0.0.0:5194"
            - name: Kestrel__Endpoints__Http__Protocols
              value: "Http1"
            - name: Kestrel__Endpoints__Grpc__Url
              value: "http://0.0.0.0:7039"
            - name: Kestrel__Endpoints__Grpc__Protocols
              value: "Http2"
            # RabbitMQ
            - name: MassTransit__RabbitMq__Host
              value: "rabbitmq"
            - name: MassTransit__RabbitMq__Username
              value: "guest"
            - name: MassTransit__RabbitMq__Password
              value: "guest"

          # Load per-service (DB) + shared JWT secrets
          envFrom:
            - secretRef: { name: fixedasset-secrets }
            - secretRef: { name: jwt-secret }

          # Probes (your app maps /health)
          startupProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
